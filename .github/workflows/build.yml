name: Build
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'

jobs:
  linux_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_linux32
            os: ubuntu-24.04
            node_dist: alpine-x86
            smoke: docker
            docker_platform: linux/386
            docker_image: i386/alpine:3.22
          - arch: amd64
            artifact: subconverter-with-web_linux64
            os: ubuntu-24.04
            node_dist: linux-x64
            smoke: native
          - arch: armv7
            artifact: subconverter-with-web_armv7
            os: ubuntu-24.04
            node_dist: linux-armv7l
            smoke: docker
            docker_platform: linux/arm/v7
            docker_image: arm32v7/debian:bookworm-slim
          - arch: aarch64
            artifact: subconverter-with-web_aarch64
            os: ubuntu-24.04-arm
            node_dist: linux-arm64
            smoke: native
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up QEMU
        if: matrix.smoke == 'docker'
        uses: docker/setup-qemu-action@v3
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm install --no-save --no-audit --no-fund webpack@5.102.1 webpack-cli@5.1.4 postject@1.0.0-alpha.6
      - name: Bundle
        run: |
          cat > webpack.config.cjs <<'EOF'
          const path = require('path');
          module.exports = {
            mode: 'production',
            target: 'node',
            entry: './dist/node.js',
            output: { path: path.resolve(__dirname, 'sea'), filename: 'app.cjs' },
            experiments: { topLevelAwait: true },
          };
          EOF
          node node_modules/webpack/bin/webpack.js --config webpack.config.cjs < /dev/null
      - name: Download target Node runtime
        run: |
          if [ "${{ matrix.node_dist }}" = "alpine-x86" ]; then
            curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86/nodejs-${{ env.NODE_VERSION }}-r0.apk" -o node.apk
            mkdir -p target-node
            tar -xzf node.apk -C target-node --no-same-owner usr/bin/node
            echo "TARGET_NODE=target-node/usr/bin/node" >> "$GITHUB_ENV"
          else
            curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.tar.xz" -o node.tar.xz
            mkdir -p target-node
            tar -xJf node.tar.xz -C target-node --strip-components=1 --no-same-owner "node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/bin"
            echo "TARGET_NODE=target-node/bin/node" >> "$GITHUB_ENV"
          fi
      - name: Build single executable
        run: |
          printf '%s' '{"main":"sea/app.cjs","output":"sea/sea-prep.blob","disableExperimentalSEAWarning":true,"useCodeCache":false}' > sea/sea-config.json
          node --experimental-sea-config sea/sea-config.json
          cp "$TARGET_NODE" subconverter-with-web
          chmod +x subconverter-with-web
          node node_modules/postject/dist/cli.js subconverter-with-web NODE_SEA_BLOB sea/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - name: Stage artifact
        run: |
          mkdir -p stage
          cp subconverter-with-web stage/
          cp -r public ACL4SSR stage/
          cat > stage/README.md <<'EOF'
          # subconverter-with-web (standalone)
          Run: `./subconverter-with-web`
          Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),
          `ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).
          Keep `public/` and `ACL4SSR/` next to the executable.
          EOF
      - name: Smoke test (native)
        if: matrix.smoke == 'native'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd stage
          PORT=3101 DB_PATH="$RUNNER_TEMP/smoke/app.db" ./subconverter-with-web > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SRVPID=$!
          trap 'kill $SRVPID 2>/dev/null || true' EXIT
          ok=""
          i=1
          while [ $i -le 30 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::smoke log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), smoke log: $TAIL"
            exit 1
          fi
      - name: Smoke test (docker)
        if: matrix.smoke == 'docker'
        run: |
          docker run -d --platform "${{ matrix.docker_platform }}" --name smoke -p 3101:3101 -v "$PWD/stage:/work" -w /work -e PORT=3101 -e DB_PATH=/tmp/smoke/app.db "${{ matrix.docker_image }}" /work/subconverter-with-web
          trap 'docker stop smoke >/dev/null 2>&1 || true; docker rm smoke >/dev/null 2>&1 || true' EXIT
          ok=""
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(docker logs smoke 2>&1 | tail -c 1500 | tr '\n' ' ')
            echo "::error::docker log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(docker logs smoke 2>&1 | tail -c 1500 | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), docker log: $TAIL"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/

  macos_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_darwin64
            os: macos-15
            node_dist: darwin-x64
            run_prefix: arch -x86_64
          - arch: arm
            artifact: subconverter-with-web_darwinarm
            os: macos-15
            node_dist: darwin-arm64
            run_prefix: ''
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rosetta 2 (Intel target only)
        if: matrix.arch == 'x86'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then sudo softwareupdate --install-rosetta --agree-to-license; fi
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm install --no-save --no-audit --no-fund webpack@5.102.1 webpack-cli@5.1.4 postject@1.0.0-alpha.6
      - name: Bundle
        run: |
          cat > webpack.config.cjs <<'EOF'
          const path = require('path');
          module.exports = {
            mode: 'production',
            target: 'node',
            entry: './dist/node.js',
            output: { path: path.resolve(__dirname, 'sea'), filename: 'app.cjs' },
            experiments: { topLevelAwait: true },
          };
          EOF
          node node_modules/webpack/bin/webpack.js --config webpack.config.cjs < /dev/null
      - name: Download target Node runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.tar.gz" -o node.tar.gz
          mkdir -p target-node
          tar -xzf node.tar.gz -C target-node --strip-components=1 "node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/bin"
          echo "TARGET_NODE=target-node/bin/node" >> "$GITHUB_ENV"
      - name: Build single executable
        run: |
          printf '%s' '{"main":"sea/app.cjs","output":"sea/sea-prep.blob","disableExperimentalSEAWarning":true,"useCodeCache":false}' > sea/sea-config.json
          node --experimental-sea-config sea/sea-config.json
          cp "$TARGET_NODE" subconverter-with-web
          chmod +x subconverter-with-web
          node node_modules/postject/dist/cli.js subconverter-with-web NODE_SEA_BLOB sea/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          codesign --remove-signature subconverter-with-web || true
          codesign --sign - --force subconverter-with-web
      - name: Stage artifact
        run: |
          mkdir -p stage
          cp subconverter-with-web stage/
          cp -r public ACL4SSR stage/
          cat > stage/README.md <<'EOF'
          # subconverter-with-web (standalone)
          Run: `./subconverter-with-web`
          Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),
          `ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).
          Keep `public/` and `ACL4SSR/` next to the executable.
          EOF
      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd stage
          PORT=3101 DB_PATH="$RUNNER_TEMP/smoke/app.db" ${{ matrix.run_prefix }} ./subconverter-with-web > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SRVPID=$!
          trap 'kill $SRVPID 2>/dev/null || true' EXIT
          ok=""
          i=1
          while [ $i -le 30 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::smoke log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), smoke log: $TAIL"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/

  windows_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_win32
            node_dist: win-x86
          - arch: amd64
            artifact: subconverter-with-web_win64
            node_dist: win-x64
    runs-on: windows-2022
    name: Windows ${{ matrix.arch }} Build
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm install --no-save --no-audit --no-fund webpack@5.102.1 webpack-cli@5.1.4 postject@1.0.0-alpha.6
      - name: Bundle
        run: |
          Set-Content -Path webpack.config.cjs -Value "const path = require('path');", "module.exports = {", "  mode: 'production',", "  target: 'node',", "  entry: './dist/node.js',", "  output: { path: path.resolve(__dirname, 'sea'), filename: 'app.cjs' },", "  experiments: { topLevelAwait: true },", "};"
          node node_modules/webpack/bin/webpack.js --config webpack.config.cjs
      - name: Download target Node runtime
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath target-node
      - name: Build single executable
        run: |
          Set-Content -Path sea/sea-config.json -Value '{"main":"sea/app.cjs","output":"sea/sea-prep.blob","disableExperimentalSEAWarning":true,"useCodeCache":false}' -NoNewline
          node --experimental-sea-config sea/sea-config.json
          Copy-Item "target-node/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/node.exe" -Destination "subconverter-with-web.exe"
          node node_modules/postject/dist/cli.js subconverter-with-web.exe NODE_SEA_BLOB sea/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item subconverter-with-web.exe -Destination stage/
          Copy-Item -Recurse public, ACL4SSR -Destination stage/
          Set-Content -Path stage/README.md -Value '# subconverter-with-web (standalone)', 'Run: `.\subconverter-with-web.exe`', 'Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),', '`ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).', 'Keep `public/` and `ACL4SSR/` next to the executable.'
      - name: Smoke test
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/smoke" | Out-Null
          $env:PORT = 3101
          $env:DB_PATH = "$env:RUNNER_TEMP/smoke/app.db"
          $p = Start-Process -FilePath "$PWD/stage/subconverter-with-web.exe" -WorkingDirectory "$PWD/stage" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/smoke.log" -RedirectStandardError "$env:RUNNER_TEMP/smoke.err"
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:3101/api/health -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
            }
            if (-not $ok) {
              $raw = ""
              if (Test-Path "$env:RUNNER_TEMP/smoke.err") { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.err") }
              if (-not $raw -and (Test-Path "$env:RUNNER_TEMP/smoke.log")) { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.log") }
              $tail = $raw.Substring([Math]::Max(0, $raw.Length - 1500)) -replace '\s+', ' '
              Write-Host "::error::smoke log: $tail"
              throw "server did not start"
            }
            curl.exe -fsS http://127.0.0.1:3101/version
            $body = '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}'
            $resp = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:3101/api/subscribe -Method Post -ContentType "application/json" -Body $body
            $sid = ($resp.Content | ConvertFrom-Json).id
            $clash = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3101/api/$sid?clash"
            Write-Host "clash bytes: $($clash.RawContentLength)"
            if ($clash.RawContentLength -lt 100000) {
              $raw = ""
              if (Test-Path "$env:RUNNER_TEMP/smoke.err") { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.err") }
              $tail = $raw.Substring([Math]::Max(0, $raw.Length - 1500)) -replace '\s+', ' '
              Write-Host "::error::clash too small, smoke log: $tail"
              throw "clash output too small"
            }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/
