name: Build
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'

jobs:
  linux_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_linux32
            os: ubuntu-24.04
            node_dist: alpine-x86
            smoke: docker
            docker_platform: linux/386
            docker_image: i386/alpine:3.22
            docker_setup: apk add --no-cache nodejs >/dev/null 2>&1;
          - arch: amd64
            artifact: subconverter-with-web_linux64
            os: ubuntu-24.04
            node_dist: linux-x64
            smoke: native
          - arch: armv7
            artifact: subconverter-with-web_armv7
            os: ubuntu-24.04
            node_dist: linux-armv7l
            smoke: docker
            docker_platform: linux/arm/v7
            docker_image: arm32v7/debian:bookworm-slim
            docker_setup: apt-get update >/dev/null 2>&1 && apt-get install -y libatomic1 >/dev/null 2>&1;
          - arch: aarch64
            artifact: subconverter-with-web_aarch64
            os: ubuntu-24.04-arm
            node_dist: linux-arm64
            smoke: native
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.arch }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up QEMU
        if: matrix.smoke == 'docker'
        uses: docker/setup-qemu-action@v3
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Install production dependencies
        run: |
          mkdir -p prod-deps
          cp package.json package-lock.json prod-deps/
          npm ci --omit=dev --no-audit --no-fund --prefix ./prod-deps
      - name: Download target Node runtime
        run: |
          if [ "${{ matrix.node_dist }}" = "alpine-x86" ]; then
            curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86/nodejs-${{ env.NODE_VERSION }}-r0.apk" -o node.apk
            mkdir -p target-node
            tar -xzf node.apk -C target-node --no-same-owner usr/bin/node
            echo "TARGET_NODE=target-node/usr/bin/node" >> "$GITHUB_ENV"
          else
            curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.tar.xz" -o node.tar.xz
            mkdir -p target-node
            tar -xJf node.tar.xz -C target-node --strip-components=1 --no-same-owner "node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/bin"
            echo "TARGET_NODE=target-node/bin/node" >> "$GITHUB_ENV"
          fi
      - name: Stage artifact
        run: |
          mkdir -p stage
          cp "$TARGET_NODE" stage/node
          chmod +x stage/node
          cp -r dist prod-deps/node_modules public ACL4SSR stage/
          cat > stage/run.sh <<'EOF'
          #!/bin/sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          cd "$DIR"
          exec "$DIR/node" "$DIR/dist/node.js" "$@"
          EOF
          chmod +x stage/run.sh
          cat > stage/README.md <<'EOF'
          # subconverter-with-web (portable)
          Run: `./run.sh` (or `./node dist/node.js`)
          Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),
          `ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).
          Keep `dist/`, `node_modules/`, `public/` and `ACL4SSR/` next to the `node` binary.
          EOF
      - name: Smoke test (native)
        if: matrix.smoke == 'native'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd stage
          PORT=3101 DB_PATH="$RUNNER_TEMP/smoke/app.db" ./node dist/node.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SRVPID=$!
          trap 'kill $SRVPID 2>/dev/null || true' EXIT
          ok=""
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            if kill -0 $SRVPID 2>/dev/null; then EXITC="still-running"; else wait $SRVPID 2>/dev/null; EXITC=$?; fi
            echo "::error::server exit: $EXITC, smoke log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), smoke log: $TAIL"
            exit 1
          fi
      - name: Smoke test (docker)
        if: matrix.smoke == 'docker'
        run: |
          docker run -d --platform "${{ matrix.docker_platform }}" --name smoke -p 3101:3101 -v "$PWD/stage:/work" -w /work -e PORT=3101 -e DB_PATH=/tmp/app.db "${{ matrix.docker_image }}" sh -c "${{ matrix.docker_setup }} exec /work/node /work/dist/node.js"
          trap 'docker stop smoke >/dev/null 2>&1 || true; docker rm smoke >/dev/null 2>&1 || true' EXIT
          ok=""
          i=1
          while [ $i -le 180 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(docker logs smoke 2>&1 | tail -c 1500 | tr '\n' ' ')
            EXITC=$(docker inspect -f '{{.State.ExitCode}}' smoke 2>/dev/null || echo "?")
            echo "::error::container exit: $EXITC, docker log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(docker logs smoke 2>&1 | tail -c 1500 | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), docker log: $TAIL"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/

  macos_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_darwin64
            os: macos-15
            node_dist: darwin-x64
            run_prefix: arch -x86_64
          - arch: arm
            artifact: subconverter-with-web_darwinarm
            os: macos-15
            node_dist: darwin-arm64
            run_prefix: ''
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rosetta 2 (Intel target only)
        if: matrix.arch == 'x86'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then sudo softwareupdate --install-rosetta --agree-to-license; fi
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Install production dependencies
        run: |
          mkdir -p prod-deps
          cp package.json package-lock.json prod-deps/
          npm ci --omit=dev --no-audit --no-fund --prefix ./prod-deps
      - name: Download target Node runtime
        run: |
          curl -fsSL "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.tar.gz" -o node.tar.gz
          mkdir -p target-node
          tar -xzf node.tar.gz -C target-node --strip-components=1 "node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/bin"
          echo "TARGET_NODE=target-node/bin/node" >> "$GITHUB_ENV"
      - name: Stage artifact
        run: |
          mkdir -p stage
          cp "$TARGET_NODE" stage/node
          chmod +x stage/node
          cp -r dist prod-deps/node_modules public ACL4SSR stage/
          cat > stage/run.sh <<'EOF'
          #!/bin/sh
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          cd "$DIR"
          exec "$DIR/node" "$DIR/dist/node.js" "$@"
          EOF
          chmod +x stage/run.sh
          cat > stage/README.md <<'EOF'
          # subconverter-with-web (portable)
          Run: `./run.sh` (or `./node dist/node.js`)
          Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),
          `ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).
          Keep `dist/`, `node_modules/`, `public/` and `ACL4SSR/` next to the `node` binary.
          EOF
      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd stage
          PORT=3101 DB_PATH="$RUNNER_TEMP/smoke/app.db" ${{ matrix.run_prefix }} ./node dist/node.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SRVPID=$!
          trap 'kill $SRVPID 2>/dev/null || true' EXIT
          ok=""
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS -m 2 http://127.0.0.1:3101/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
            i=$((i+1))
          done
          if [ -z "$ok" ]; then
            echo "server did not start"
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            if kill -0 $SRVPID 2>/dev/null; then EXITC="still-running"; else wait $SRVPID 2>/dev/null; EXITC=$?; fi
            echo "::error::server exit: $EXITC, smoke log: $TAIL"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3101/version
          SID=$(curl -fsS -X POST http://127.0.0.1:3101/api/subscribe -H 'content-type: application/json' -d '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          SIZE=$(curl -fsS -o /dev/null -w "%{size_download}" "http://127.0.0.1:3101/api/$SID?clash")
          echo "clash bytes: $SIZE"
          if [ "$SIZE" -le 100000 ]; then
            TAIL=$(tail -c 1500 "$RUNNER_TEMP/smoke.log" 2>/dev/null | tr '\n' ' ')
            echo "::error::clash too small ($SIZE), smoke log: $TAIL"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/

  windows_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            artifact: subconverter-with-web_win32
            node_dist: win-x86
          - arch: amd64
            artifact: subconverter-with-web_win64
            node_dist: win-x64
    runs-on: windows-2022
    name: Windows ${{ matrix.arch }} Build
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Install production dependencies
        run: |
          New-Item -ItemType Directory -Force -Path prod-deps | Out-Null
          Copy-Item package.json, package-lock.json -Destination prod-deps/
          npm ci --omit=dev --no-audit --no-fund --prefix ./prod-deps
      - name: Download target Node runtime
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath target-node
      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target-node/node-v${{ env.NODE_VERSION }}-${{ matrix.node_dist }}/node.exe" -Destination stage/node.exe
          Copy-Item -Recurse dist -Destination stage/
          Copy-Item -Recurse prod-deps/node_modules -Destination stage/
          Copy-Item -Recurse public, ACL4SSR -Destination stage/
          Set-Content -Path stage/run.bat -Value '@echo off', 'cd /d "%~dp0"', '"%~dp0node.exe" "%~dp0dist/node.js" %*'
          Set-Content -Path stage/README.md -Value '# subconverter-with-web (portable)', 'Run: `run.bat` (or `node.exe dist/node.js`)', 'Env: `PORT` (default 3000), `DB_PATH` (default data/app.db),', '`ADMIN_USERNAME` / `ADMIN_PASSWORD` (optional; no password = open admin).', 'Keep `dist/`, `node_modules/`, `public/` and `ACL4SSR/` next to `node.exe`.'
      - name: Smoke test
        run: |
          Write-Host "::error::PROBE smoke start"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/smoke" | Out-Null
          $env:PORT = 3101
          $env:DB_PATH = "$env:RUNNER_TEMP/smoke/app.db"
          $nodeExe = "$env:GITHUB_WORKSPACE/stage/node.exe"
          $stageDir = "$env:GITHUB_WORKSPACE/stage"
          Write-Host "node exists: $(Test-Path $nodeExe)"
          $p = Start-Process -FilePath $nodeExe -ArgumentList "dist/node.js" -WorkingDirectory $stageDir -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/smoke.log" -RedirectStandardError "$env:RUNNER_TEMP/smoke.err"
          Write-Host "started pid: $($p.Id)"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:3101/api/health -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          if (-not $ok) {
            $raw = ""
            if (Test-Path "$env:RUNNER_TEMP/smoke.err") { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.err") }
            if (-not $raw -and (Test-Path "$env:RUNNER_TEMP/smoke.log")) { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.log") }
            $tail = $raw.Substring([Math]::Max(0, $raw.Length - 1500)) -replace '\s+', ' '
            Write-Host "::error::smoke log: $tail"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "::notice::PROBE health ok"
          Start-Sleep 10
          curl.exe -fsS http://127.0.0.1:3101/version
          Write-Host "::notice::PROBE version ok"
          $body = '{"sources":["vmess://eyJ2IjoiMiIsInBzIjoidGVzdCIsImFkZCI6IjEuMi4zLjQiLCJwb3J0IjoiNDQzIiwiaWQiOiIxMTExMTExMS0yMjIyLTMzMzMtNDQ0NC01NTU1NTU1NTU1NTUiLCJhaWQiOiIwIiwic2N5IjoiYXV0byIsIm5ldCI6IndzIiwidHlwZSI6Im5vbmUiLCJob3N0IjoiIiwicGF0aCI6Ii8iLCJ0bHMiOiJ0bHMifQ=="],"rulesUrl":"local://acl4ssr/Clash/config/ACL4SSR.ini","backendId":"builtin","name":"smoke"}'
          $clashOk = $false
          $clashBytes = 0
          for ($attempt = 0; $attempt -lt 4 -and -not $clashOk; $attempt++) {
            if ($attempt -gt 0) { Start-Sleep 5 }
            $resp = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:3101/api/subscribe -Method Post -ContentType "application/json" -Body $body
            $sid = ($resp.Content | ConvertFrom-Json).id
            Write-Host "::notice::PROBE subscribe ok sid=$sid attempt=$attempt"
            $dump = curl.exe -s "http://127.0.0.1:3101/api/admin/data"
            $found = $dump.Contains($sid)
            Write-Host "::notice::PROBE store has sid in admin-data: $found"
            $baseUrl = "http://127.0.0.1:3101/api/" + $sid
            $codeBase = curl.exe -s -o NUL -w "%{http_code}" $baseUrl
            $codeB64 = curl.exe -s -o NUL -w "%{http_code}" ($baseUrl + "?b64")
            Write-Host "::notice::PROBE base http=$codeBase b64 http=$codeB64"
            $code = curl.exe -s -o "$env:RUNNER_TEMP/clash.yaml" -w "%{http_code}" ($baseUrl + "?clash")
            $sz = 0
            if (Test-Path "$env:RUNNER_TEMP/clash.yaml") { $sz = (Get-Item "$env:RUNNER_TEMP/clash.yaml").Length }
            Write-Host "::notice::PROBE clash attempt $attempt http=$code bytes=$sz"
            if ($code -eq "200" -and $sz -ge 100000) { $clashOk = $true; $clashBytes = $sz }
          }
          Write-Host "::notice::PROBE clash ok bytes=$clashBytes"
          Write-Host "clash bytes: $clashBytes"
          if (-not $clashOk) {
            $raw = ""
            if (Test-Path "$env:RUNNER_TEMP/smoke.err") { $raw = [IO.File]::ReadAllText("$env:RUNNER_TEMP/smoke.err") }
            $tail = $raw.Substring([Math]::Max(0, $raw.Length - 1500)) -replace '\s+', ' '
            Write-Host "::error::clash too small or missing after retries, smoke log: $tail"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/
